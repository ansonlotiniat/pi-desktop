<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Starter feature</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: #eceeea;
        background: #0c0d0e;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        --line: rgba(236, 238, 234, .12);
        --muted: #929690;
        --accent: #8bc493;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body { margin: 0; background: #0c0d0e; }
      button { font: inherit; }
      main { display: grid; min-height: 100%; grid-template-rows: 52px minmax(0, 1fr); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: #101112; }
      .identity { min-width: 0; }
      h1 { margin: 0; font-size: 15px; font-weight: 680; }
      #workspace { overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; align-items: center; gap: 7px; }
      button { min-height: 32px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: #17191a; color: #c9ccc7; font-size: 12.5px; font-weight: 650; cursor: pointer; }
      button:hover { border-color: rgba(236, 238, 234, .22); background: #1d1f20; color: #eceeea; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .content { display: grid; min-width: 0; min-height: 0; grid-template-columns: 220px minmax(0, 1fr); }
      nav { padding: 12px 9px; border-right: 1px solid var(--line); background: #101112; }
      nav strong { display: block; padding: 4px 8px 8px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
      .nav-item { width: 100%; min-height: 34px; border: 0; background: transparent; text-align: left; }
      .nav-item.active { background: rgba(117, 173, 126, .16); color: #e4f1e6; box-shadow: inset 2px 0 var(--accent); }
      section { min-width: 0; min-height: 0; overflow: auto; padding: 24px; }
      .section-heading { margin-bottom: 16px; }
      h2 { margin: 0; font-size: 19px; font-weight: 680; }
      p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
      pre { min-height: 180px; margin: 0; padding: 14px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: #101112; color: #ccd0ca; font: 12.5px/1.6 "SFMono-Regular", Menlo, monospace; white-space: pre-wrap; }
      #notice { min-height: 20px; margin-top: 10px; color: var(--accent); font-size: 12px; }
      #notice.error { color: #e49b96; }
      @media (max-width: 620px) { .content { grid-template-columns: 1fr; } nav { display: flex; border-right: 0; border-bottom: 1px solid var(--line); } nav strong { display: none; } section { padding: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="identity"><h1>Starter feature</h1><div id="workspace">Loading workspace</div></div>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="chat" type="button">Open chat</button>
        </div>
      </header>
      <div class="content">
        <nav aria-label="Feature sections">
          <strong>Sections</strong>
          <button class="nav-item active" type="button">Workspace</button>
        </nav>
        <section>
          <div class="section-heading">
            <h2>Workspace status</h2>
            <p>This surface is fully owned by the feature. Replace this flow with the user's real task.</p>
          </div>
          <pre id="output" aria-live="polite">Loading</pre>
          <div id="notice" role="status"></div>
        </section>
      </div>
    </main>
    <script>
      const output = document.querySelector("#output");
      const workspace = document.querySelector("#workspace");
      const notice = document.querySelector("#notice");
      const refresh = document.querySelector("#refresh");

      function showError(error) {
        notice.className = "error";
        notice.textContent = error instanceof Error ? error.message : String(error);
      }

      async function load() {
        refresh.disabled = true;
        notice.className = "";
        notice.textContent = "";
        output.textContent = "Loading";
        try {
          const [context, status] = await Promise.all([
            window.piDesktop.getContext(),
            window.piDesktop.service.request("workspace.status"),
          ]);
          workspace.textContent = context.workspace.cwd;
          output.textContent = status.text || "Working tree is clean.";
        } catch (error) {
          output.textContent = "Workspace status unavailable.";
          showError(error);
        } finally {
          refresh.disabled = false;
        }
      }

      refresh.addEventListener("click", load);
      document.querySelector("#chat").addEventListener("click", () => window.piDesktop.navigate("chat"));
      void load();
    </script>
  </body>
</html>
